version: "3.8"

services:
  # Option 1: Full-Stack Unified Container (Matches Render Production)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: textile-qc-app
    environment:
      - PORT=8080
      - JAVA_OPTS=-Xms128m -Xmx512m
    ports:
      - "8080:8080"
    restart: unless-stopped

