# Render Blueprint Specification (render.yaml)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: textile-color-qc-system
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/batches/current
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: JAVA_OPTS
        value: "-Xms128m -Xmx512m -XX:+UseG1GC"
